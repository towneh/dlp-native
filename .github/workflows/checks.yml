name: Checks

on:
  push:
    branches: [main, master, test-*]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Tool versions are pinned so a new release cannot turn the build red on its own.
env:
  RUFF_VERSION: '0.16.2'
  PYTEST_VERSION: '9.1.1'
  ZIZMOR_VERSION: '1.29.0'
  ACTIONLINT_VERSION: '1.7.12.24'

jobs:
  # ── Python lint ─────────────────────────────────────────────────────────────
  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      # No submodules: vendor/ is upstream and excluded in ruff.toml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Lint
        run: uvx ruff@${{ env.RUFF_VERSION }} check --output-format github .

      - name: Format
        run: uvx ruff@${{ env.RUFF_VERSION }} format --check .

  # ── Python tests ────────────────────────────────────────────────────────────
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Run tests
        run: uvx pytest@${{ env.PYTEST_VERSION }} tests/ -q

  # ── Workflow syntax and security ────────────────────────────────────────────
  workflows:
    name: workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      # actionlint ships as a Go binary; the PyPI wrapper avoids taking on another
      # third-party action just to run it.
      - name: actionlint
        run: uvx --from actionlint-py==${{ env.ACTIONLINT_VERSION }} actionlint

      - name: zizmor
        run: uvx zizmor@${{ env.ZIZMOR_VERSION }} --no-progress .github/workflows/
