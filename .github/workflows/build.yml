name: Build

on:
  push:
    branches: [main, master, test-*]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The CPython that ships in the package. abi3-py312 in Cargo.toml is the floor
  # the native lib builds against, so the shipped runtime can be newer than that.
  PYTHON_VERSION: '3.14'
  # Discovery request. The +gil variant keeps `uv python find` off a free-threaded
  # build and off any active virtualenv (with --system). Install uses the bare
  # version instead: the download index has no +gil tag, the GIL build is the
  # untagged default, and only +freethreaded is labelled.
  PYTHON_REQUEST: '3.14+gil'
  # python-apple-support release supplying the iOS static framework.
  IOS_SUPPORT_BUILD: 'b10'

jobs:
  # ── Lint ────────────────────────────────────────────────────────────────────
  # rust-toolchain.toml has always installed clippy; nothing ran it. The
  # workspace [lints] table denies undocumented unsafe blocks and truncating
  # casts, which only bites if something enforces it.
  lint:
    name: rustfmt + clippy
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false

      # Submodules are cloned shallow, which brings neither tags nor history.
      # The bundled yt-dlp-ejs version is read from its tag, and resolving a pin
      # made after a release needs to walk back to that tag, so restore both.
      - name: Fetch yt-dlp-ejs tags and history
        shell: bash
        run: |
          git -C vendor/yt-dlp-ejs fetch --tags --force --quiet
          # --unshallow errors on a complete clone, so ask first.
          if [ "$(git -C vendor/yt-dlp-ejs rev-parse --is-shallow-repository)" = "true" ]; then
            git -C vendor/yt-dlp-ejs fetch --unshallow --quiet
          fi

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install Python ${{ env.PYTHON_VERSION }}
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: lint-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: lint-cargo-

      - name: Export PYO3_PYTHON
        shell: pwsh
        run: |
          $found = uv python find --system ${{ env.PYTHON_REQUEST }}
          $code = $LASTEXITCODE
          $python = ($found -join "`n").Trim()
          if ($code -ne 0 -or [string]::IsNullOrWhiteSpace($python)) {
            throw "uv could not find Python ${{ env.PYTHON_REQUEST }} (exit $code)"
          }
          "PYO3_PYTHON=$python" | Out-File -FilePath $env:GITHUB_ENV -Append

      # The vendored deno_ast declares a version it is not, so that rustyscript's
      # exact pin resolves. VENDOR.md is the source of truth for both numbers;
      # this asserts the crate's manifests still agree with it. VENDOR.md states
      # the guidance that depends on those numbers without repeating them, so
      # keeping the two in step is all that is needed to keep it true.
      - name: Vendored deno_ast matches VENDOR.md
        shell: bash
        run: |
          set -euo pipefail
          doc_real=$(grep -oP '\| Real version \| \*\*\K[0-9][^*]*' VENDOR.md || :)
          doc_declared=$(grep -oP '\| Version it declares \| \*\*\K[0-9][^*]*' VENDOR.md || :)
          real=$(grep -m1 '^version' crates/deno_ast_patch/Cargo.toml.orig | cut -d'"' -f2)
          declared=$(grep -m1 '^version' crates/deno_ast_patch/Cargo.toml | cut -d'"' -f2)
          echo "VENDOR.md: real=$doc_real declared=$doc_declared"
          echo "manifests: real=$real declared=$declared"
          if [ -z "$doc_real" ] || [ -z "$doc_declared" ]; then
            echo "::error::Could not read the deno_ast versions from VENDOR.md — has the table changed shape?"
            exit 1
          fi
          if [ "$real" != "$doc_real" ] || [ "$declared" != "$doc_declared" ]; then
            echo "::error::crates/deno_ast_patch is $real declaring $declared, but VENDOR.md says $doc_real declaring $doc_declared. Update the VENDOR.md table in the same change."
            exit 1
          fi

      - name: rustfmt
        run: cargo fmt --all --check

      # Both JS backends are linted and tested: they sit behind mutually
      # exclusive features, so a default run never touches the QuickJS path that
      # Linux, Android and iOS ship. Do not use --all-features here — it would
      # enable both backends at once and trip their compile_error!.
      - name: clippy (V8 backend, the default feature)
        run: cargo clippy --all-targets -- -D warnings

      - name: clippy (QuickJS backend)
        run: cargo clippy -p unity_dlp_core --all-targets --no-default-features --features js-quickjs -- -D warnings

      - name: Unit tests (V8 backend)
        run: cargo test --workspace --lib

      - name: Unit tests (QuickJS backend)
        run: cargo test -p unity_dlp_core --lib --no-default-features --features js-quickjs

  # ── Windows x64 ─────────────────────────────────────────────────────────────
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false

      # Submodules are cloned shallow, which brings neither tags nor history.
      # The bundled yt-dlp-ejs version is read from its tag, and resolving a pin
      # made after a release needs to walk back to that tag, so restore both.
      - name: Fetch yt-dlp-ejs tags and history
        shell: bash
        run: |
          git -C vendor/yt-dlp-ejs fetch --tags --force --quiet
          # --unshallow errors on a complete clone, so ask first.
          if [ "$(git -C vendor/yt-dlp-ejs rev-parse --is-shallow-repository)" = "true" ]; then
            git -C vendor/yt-dlp-ejs fetch --unshallow --quiet
          fi

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install Python ${{ env.PYTHON_VERSION }}
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: windows-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: windows-cargo-

      - name: Build
        run: pwsh scripts/build-host.ps1

      - name: Stage Python stdlib
        shell: pwsh
        run: |
          $found = uv python find --system ${{ env.PYTHON_REQUEST }}
          $code = $LASTEXITCODE
          $python = ($found -join "`n").Trim()
          if ($code -ne 0 -or [string]::IsNullOrWhiteSpace($python)) {
            throw "uv could not find Python ${{ env.PYTHON_REQUEST }} (exit $code)"
          }
          & $python "unity_package/Python~/stage_stdlib.py" windows-x86_64 --python $python

      - name: CLI smoke test
        run: cargo run -p unity_dlp_cli --profile release-with-debuginfo -- version

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unity_dlp-windows-x64
          path: |
            unity_package/Plugins/x86_64/unity_dlp.dll
            unity_package/StreamingAssets/dlp/

  # ── macOS universal ──────────────────────────────────────────────────────────
  macos:
    name: macOS universal
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false

      # Submodules are cloned shallow, which brings neither tags nor history.
      # The bundled yt-dlp-ejs version is read from its tag, and resolving a pin
      # made after a release needs to walk back to that tag, so restore both.
      - name: Fetch yt-dlp-ejs tags and history
        shell: bash
        run: |
          git -C vendor/yt-dlp-ejs fetch --tags --force --quiet
          # --unshallow errors on a complete clone, so ask first.
          if [ "$(git -C vendor/yt-dlp-ejs rev-parse --is-shallow-repository)" = "true" ]; then
            git -C vendor/yt-dlp-ejs fetch --unshallow --quiet
          fi

      # actions/setup-python on macos-latest installs a universal2 build, which
      # PyO3 can use for both the native arm64 and the x86_64 cross-compile.
      - name: Install Python ${{ env.PYTHON_VERSION }} (universal2)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Export PYO3_PYTHON
        run: echo "PYO3_PYTHON=$(python3 -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"

      - name: Install uv (for hatch_build.py in build.rs)
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: macos-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: macos-cargo-

      - name: Build universal dylib
        run: bash scripts/build-macos-universal.sh

      - name: Stage Python stdlib
        run: |
          "$PYO3_PYTHON" "unity_package/Python~/stage_stdlib.py" macos-universal --python "$PYO3_PYTHON"

      - name: CLI smoke test
        run: cargo run -p unity_dlp_cli --profile release-with-debuginfo -- version

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unity_dlp-macos-universal
          path: |
            unity_package/Plugins/x86_64/unity_dlp.dylib
            unity_package/Plugins/x86_64/Python
            unity_package/StreamingAssets/dlp/

  # ── Linux x64 ───────────────────────────────────────────────────────────────
  linux:
    name: Linux x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false

      # Submodules are cloned shallow, which brings neither tags nor history.
      # The bundled yt-dlp-ejs version is read from its tag, and resolving a pin
      # made after a release needs to walk back to that tag, so restore both.
      - name: Fetch yt-dlp-ejs tags and history
        shell: bash
        run: |
          git -C vendor/yt-dlp-ejs fetch --tags --force --quiet
          # --unshallow errors on a complete clone, so ask first.
          if [ "$(git -C vendor/yt-dlp-ejs rev-parse --is-shallow-repository)" = "true" ]; then
            git -C vendor/yt-dlp-ejs fetch --unshallow --quiet
          fi

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install Python ${{ env.PYTHON_VERSION }}
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: linux-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: linux-cargo-

      - name: Build
        run: bash scripts/build-host.sh

      - name: Stage Python stdlib
        run: |
          PYTHON="$(uv python find --system ${{ env.PYTHON_REQUEST }})"
          if [ -z "$PYTHON" ]; then
            echo "uv could not find Python ${{ env.PYTHON_REQUEST }}" >&2
            exit 1
          fi
          "$PYTHON" "unity_package/Python~/stage_stdlib.py" linux-x86_64 --python "$PYTHON"

      - name: CLI smoke test
        run: cargo run -p unity_dlp_cli --profile release-with-debuginfo --no-default-features --features js-quickjs -- version

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unity_dlp-linux-x64
          path: |
            unity_package/Plugins/x86_64/libunity_dlp.so
            unity_package/Plugins/x86_64/libpython*.so*
            unity_package/StreamingAssets/dlp/

  # ── Android arm64-v8a ────────────────────────────────────────────────────────
  android:
    name: Android arm64-v8a
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false

      # Submodules are cloned shallow, which brings neither tags nor history.
      # The bundled yt-dlp-ejs version is read from its tag, and resolving a pin
      # made after a release needs to walk back to that tag, so restore both.
      - name: Fetch yt-dlp-ejs tags and history
        shell: bash
        run: |
          git -C vendor/yt-dlp-ejs fetch --tags --force --quiet
          # --unshallow errors on a complete clone, so ask first.
          if [ "$(git -C vendor/yt-dlp-ejs rev-parse --is-shallow-repository)" = "true" ]; then
            git -C vendor/yt-dlp-ejs fetch --unshallow --quiet
          fi

      - name: Install Rust Android target
        run: rustup target add aarch64-linux-android

      - name: Install libclang (for rquickjs-sys bindgen)
        run: sudo apt-get install -y libclang-dev

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Locate Android NDK and configure bindgen sysroot
        run: |
          NDK_DIR="$(find "$ANDROID_SDK_ROOT/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          NDK_SYSROOT="$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          {
            echo "ANDROID_NDK_HOME=$NDK_DIR"
            echo "BINDGEN_EXTRA_CLANG_ARGS=--sysroot=$NDK_SYSROOT --target=aarch64-linux-android26"
          } >> "$GITHUB_ENV"

      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: android-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: android-cargo-

      # Termux's pool only carries the current build, so there is no older version
      # to pin to — take the latest and assert the version in the next step. The
      # download is checked against the SHA-256 the repository index publishes for
      # it, since this binary ends up in the shipped artifact and runs inside the
      # application's own process.
      # The index states the checksum of every package, so it decides what counts as
      # authentic and has to be authenticated itself. Its OpenPGP signature is checked
      # against a key committed to this repository: fetching the key would leave the
      # trust rooted in whatever served it, which is the thing being established.
      - name: Fetch and authenticate the Termux package index
        run: |
          set -euo pipefail
          FPR="CC72CF8BA7DBFA0182877D045A897D96E57CF20C"
          DIST="https://packages.termux.dev/apt/termux-main/dists/stable"
          GNUPGHOME="$(mktemp -d)"
          export GNUPGHOME
          chmod 700 "$GNUPGHOME"
          gpg --quiet --import .github/keys/termux-autobuilds.gpg

          curl -fsSL "$DIST/InRelease" -o /tmp/termux-inrelease
          # VALIDSIG carries the fingerprint that actually signed it. Checking the
          # exit status alone would accept a good signature from any imported key.
          # --batch --yes: without them gpg asks before replacing an existing output
          # file, and a re-run fails there instead of at any of the checks below.
          gpg --batch --yes --status-fd 1 --output /tmp/termux-release \
            --decrypt /tmp/termux-inrelease > /tmp/termux-gpg-status 2>/dev/null
          if ! grep -q "^\[GNUPG:\] VALIDSIG $FPR " /tmp/termux-gpg-status; then
            echo "::error::the Termux index is not signed by $FPR"
            cat /tmp/termux-gpg-status
            exit 1
          fi

          # A signature says the index is authentic, not that it is current. Without
          # an age bound an old index, the package list it vouches for and the
          # packages themselves can be served together, and every check here passes
          # while an outdated interpreter is built. Termux publishes no Valid-Until,
          # so the bound comes from the signed Date; the field is honoured anyway in
          # case that changes.
          MAX_AGE_DAYS=7
          now="$(date -u +%s)"

          expires="$(sed -n 's/^Valid-Until: //p' /tmp/termux-release | head -1)"
          if [ -n "$expires" ]; then
            expires_epoch="$(date -u -d "$expires" +%s 2>/dev/null || true)"
            if [ -z "$expires_epoch" ]; then
              echo "::error::could not read Valid-Until from the signed index: $expires"
              exit 1
            fi
            if [ "$expires_epoch" -lt "$now" ]; then
              echo "::error::the signed index expired at $expires"
              exit 1
            fi
          fi

          released="$(sed -n 's/^Date: //p' /tmp/termux-release | head -1)"
          released_epoch="$(date -u -d "$released" +%s 2>/dev/null || true)"
          if [ -z "$released_epoch" ]; then
            echo "::error::the signed index carries no readable Date, so its age cannot be bounded"
            exit 1
          fi
          age_days=$(( (now - released_epoch) / 86400 ))
          if [ "$age_days" -gt "$MAX_AGE_DAYS" ]; then
            echo "::error::the signed index is ${age_days} days old, over the ${MAX_AGE_DAYS} day limit. Either the repository has stopped publishing or an old index is being replayed; confirm which before raising the limit."
            exit 1
          fi
          echo "==> index dated $released (${age_days}d old)"

          curl -fsSL "$DIST/main/binary-aarch64/Packages" -o /tmp/termux-packages
          WANT="$(awk '/^SHA256:/ { s = 1; next } /^[A-Za-z]/ { s = 0 }
            s && $3 == "main/binary-aarch64/Packages" { print $1; exit }' /tmp/termux-release)"
          GOT="$(sha256sum /tmp/termux-packages | cut -d' ' -f1)"
          if [ -z "$WANT" ] || [ "$WANT" != "$GOT" ]; then
            echo "::error::the package index does not match the checksum in the signed release ($WANT vs $GOT)"
            exit 1
          fi
          echo "==> index authenticated against $FPR"

      - name: Download Termux Python for aarch64
        run: |
          set -euo pipefail
          BASE="https://packages.termux.dev/apt/termux-main/pool/main/p/python"
          PYTHON_DEB="$(curl -fsSL "$BASE/" \
            | grep -oP 'python_[^"]+_aarch64\.deb' | sort -V | tail -1)"
          echo "==> $PYTHON_DEB"
          curl -fsSL "$BASE/$PYTHON_DEB" -o /tmp/python.deb
          WANT="$(awk -v deb="$PYTHON_DEB" 'BEGIN { RS = "" }
            $0 ~ ("Filename: .*/" deb "\n") {
              for (i = 1; i <= NF; i++) if ($i == "SHA256:") { print $(i + 1); exit }
            }' /tmp/termux-packages)"
          if [ -z "$WANT" ]; then
            echo "::error::the authenticated index publishes no SHA256 for $PYTHON_DEB"
            exit 1
          fi
          echo "$WANT  /tmp/python.deb" | sha256sum -c -
          mkdir -p /tmp/termux-extract
          cd /tmp/termux-extract && ar x /tmp/python.deb && tar xf data.tar.xz

      # Termux's libpython is built against Termux's own libc compatibility shim,
      # which ships as a separate package. It has to travel with the interpreter:
      # without it the loader cannot open libunity_dlp, and Unity reports that as
      # DllNotFoundException on the plugin rather than on the library actually absent.
      # Extracted over the same prefix so the staging step below finds both together.
      # Pinned rather than latest-wins, and checked before it is opened: this ends up
      # in the shipped artifact and is loaded into the application's process.
      - name: Download Termux libandroid-support for aarch64
        run: |
          set -euo pipefail
          SUPPORT_DEB="libandroid-support_29-1_aarch64.deb"
          SUPPORT_SHA256="f2f145d6135ad4843ac9670153be3e3944dc1e6f1736d46d2306c28f2b86f517"
          BASE="https://packages.termux.dev/apt/termux-main/pool/main/liba/libandroid-support"
          if ! curl -fsSL "$BASE/$SUPPORT_DEB" -o /tmp/libandroid-support.deb; then
            echo "::error::$SUPPORT_DEB is no longer in the Termux pool, which keeps only the current build. Read the new version and its SHA256 out of dists/stable/main/binary-aarch64/Packages and move both together."
            exit 1
          fi
          echo "$SUPPORT_SHA256  /tmp/libandroid-support.deb" | sha256sum -c -
          cd /tmp/termux-extract && ar x /tmp/libandroid-support.deb && tar xf data.tar.xz

      # The stdlib's C extensions link against Termux's own libraries: zlib for zlib and
      # binascii, OpenSSL for _ssl and _hashlib, libffi for _ctypes, expat for pyexpat.
      # Without them the modules load and then fail at dlopen on the device, so an
      # extraction never reaches HTTPS. Extracted over the same prefix, where
      # stage_android_libs.py picks up whatever the modules actually declare.
      #
      # Version and checksum come from the index authenticated above rather than being
      # pinned here: the pool keeps only the current build, so a pinned hash rots the
      # moment Termux rebuilds. If the modules ever need a library none of these
      # packages ships, stage_android_libs.py fails the build and names it.
      - name: Download Termux runtime libraries for aarch64
        run: |
          set -euo pipefail
          REPO="https://packages.termux.dev/apt/termux-main"
          for pkg in zlib openssl libffi libexpat; do
            meta="$(awk -v want="$pkg" 'BEGIN { RS = "" } {
              name = ""; file = ""; sha = ""
              for (i = 1; i <= NF; i++) {
                if ($i == "Package:")  name = $(i + 1)
                if ($i == "Filename:") file = $(i + 1)
                if ($i == "SHA256:")   sha  = $(i + 1)
              }
              if (name == want) { print file, sha; exit }
            }' /tmp/termux-packages)"
            file="${meta%% *}"
            sha="${meta##* }"
            if [ -z "$meta" ] || [ "$file" = "$sha" ]; then
              echo "::error::the authenticated index publishes no aarch64 $pkg package"
              exit 1
            fi
            echo "==> $file"
            if ! curl -fsSL "$REPO/$file" -o "/tmp/$pkg.deb"; then
              echo "::error::$file is listed in the index but missing from the pool"
              exit 1
            fi
            echo "$sha  /tmp/$pkg.deb" | sha256sum -c -
            ( cd /tmp/termux-extract && ar x "/tmp/$pkg.deb" && tar xf data.tar.xz )
          done

      - name: Set up PYO3_CROSS_LIB_DIR for Android arm64
        run: |
          PREFIX="/tmp/termux-extract/data/data/com.termux/files/usr"
          mkdir -p python-android-lib
          # Detect the actual Python version shipped in the .deb
          LIBPY="$(find "$PREFIX/lib" -maxdepth 1 -name 'libpython3.*.so*' | sort -V | tail -1)"
          PY_VER="$(echo "$LIBPY" | grep -oP '(?<=libpython)\d+\.\d+')"
          echo "==> Found libpython${PY_VER}"
          if [ "$PY_VER" != "${{ env.PYTHON_VERSION }}" ]; then
            echo "::error::Termux now ships Python ${PY_VER}, but this build targets ${{ env.PYTHON_VERSION }}. Bump PYTHON_VERSION and move the other platforms with it, or Android ends up on a different interpreter from everything else."
            exit 1
          fi
          cp -L "$LIBPY" "python-android-lib/libpython${PY_VER}.so"
          LIB_DIR="$(pwd)/python-android-lib"
          # PYO3_NO_PYTHON skips sysconfig parsing; without it pyo3-build-config reads
          # LIBDIR from the Termux sysconfig (/data/data/com.termux/...) which doesn't
          # exist on the runner, so the linker search path is wrong. TERMUX_PREFIX is
          # exposed for stdlib staging.
          {
            echo "PYO3_CROSS_LIB_DIR=$LIB_DIR"
            echo "PYO3_CROSS_PYTHON_VERSION=${PY_VER}"
            echo "PYO3_NO_PYTHON=1"
            echo "TERMUX_PREFIX=$PREFIX"
          } >> "$GITHUB_ENV"

      - name: Build Android arm64-v8a
        run: |
          cargo ndk \
            --target aarch64-linux-android \
            --platform 26 \
            -- build -p unity_dlp_core --profile release-with-debuginfo \
            --no-default-features --features js-quickjs

      # Copies the libraries the extensions declare in beside them and repoints RUNPATH
      # at $ORIGIN, since Termux records its own prefix there and the loader will not
      # search the directory a module was opened from. Runs against the prefix, so the
      # staging step below simply zips the result.
      - name: Stage Android runtime libraries into lib-dynload
        run: |
          python3 "unity_package/Python~/stage_android_libs.py" --prefix "$TERMUX_PREFIX"

      - name: Stage Python stdlib
        run: |
          python3 "unity_package/Python~/stage_stdlib.py" android-arm64-v8a --prefix "$TERMUX_PREFIX"

      - name: Stage artifact
        run: |
          set -euo pipefail
          DEST=unity_package/Plugins/Android/libs/arm64-v8a
          mkdir -p "$DEST"
          cp target/aarch64-linux-android/release-with-debuginfo/libunity_dlp.so "$DEST/"
          # Under each library's own SONAME, because that is the name its dependents
          # record in NEEDED and therefore the only name the loader will look for.
          # Termux ships these unversioned today, so this is about surviving the day
          # it ships libpython3.14.so.1.0 instead.
          LIBPY="$(find "$TERMUX_PREFIX/lib" -maxdepth 1 -name 'libpython3.*.so*' \
            | sort -V | tail -1)"
          LIBSUPPORT="$(find "$TERMUX_PREFIX/lib" -maxdepth 1 -name 'libandroid-support.so*' \
            | sort -V | tail -1)"
          for src in "$LIBPY" "$LIBSUPPORT"; do
            soname="$(readelf -d "$src" | sed -n 's/.*(SONAME).*\[\(.*\)\]/\1/p')"
            # libandroid-support declares no SONAME. A library without one is
            # recorded by its dependents under the filename they linked against,
            # so that filename is the name to stage it under.
            [ -n "$soname" ] || soname="$(basename "$src")"
            cp -L "$src" "$DEST/$soname"
          done

      # A library that is needed but never staged does not fail anything here — it
      # fails at dlopen on the device, reported against whichever library depends on
      # it. Resolve every NEEDED entry now, against what is staged plus the platform's
      # own libraries, so that gap is a red build instead of a red headset.
      - name: Verify staged Android libraries resolve
        run: |
          cd unity_package/Plugins/Android/libs/arm64-v8a
          # Without this the loop below reads nothing and the step passes, which is the
          # failure it exists to catch.
          command -v readelf >/dev/null || {
            echo "::error::readelf is not installed, so this check cannot run"
            exit 1
          }
          # Only libraries Android itself provides. libc++_shared is deliberately
          # absent: it is an NDK runtime, so anything needing it has to be staged
          # here rather than borrowed from whatever else the host application ships.
          platform='^(libc|libm|libdl|liblog|libandroid|libz|libGLESv[123]|libEGL|libOpenSLES|libvulkan)\.so$'
          rc=0
          # *.so* rather than *.so, so a version-suffixed name is examined here
          # instead of being skipped by the very check meant to reject it.
          for so in *.so*; do
            # The loader resolves NEEDED entries by exact filename, and a name
            # carrying a version suffix would not match the staged file.
            case "$so" in
              lib*.so) ;;
              *)
                echo "::error::$so is not named lib<name>.so, so nothing depending on it can resolve it"
                rc=1
                ;;
            esac
            dyn="$(readelf -d "$so")" || {
              echo "::error::readelf could not read $so"
              exit 1
            }
            for need in $(printf '%s' "$dyn" | sed -n 's/.*(NEEDED).*\[\(.*\)\]/\1/p'); do
              if [ -f "$need" ]; then
                continue
              fi
              if printf '%s' "$need" | grep -qE "$platform"; then
                continue
              fi
              echo "::error::$so needs $need, which is neither staged beside it nor an Android platform library"
              rc=1
            done
          done
          exit "$rc"

      # The step above covers the three libraries staged into the APK. The stdlib zip
      # carries ~65 more shared objects, and those are where this last went wrong: the
      # extensions resolved, their own dependencies did not, and the first sign of it
      # was an ImportError on a headset. Same resolution rules, applied to the archive
      # that actually ships.
      - name: Verify staged Python extensions resolve
        run: |
          work="$(mktemp -d)"
          unzip -q unity_package/StreamingAssets/dlp/stdlib/android-arm64-v8a.zip -d "$work"
          cd "$work"/lib/python3*/lib-dynload || {
            echo "::error::the staged stdlib has no lib-dynload directory"
            exit 1
          }
          platform='^(libc|libm|libdl|liblog|libandroid|libz|libGLESv[123]|libEGL|libOpenSLES|libvulkan)\.so$'
          # Staged into Plugins/Android/libs/, so they land in the APK's lib directory,
          # which is on the classloader namespace's search path.
          in_apk='^(libpython3\.[0-9]+|libandroid-support)\.so$'
          rc=0
          # Both patterns: modules and unversioned libraries end in .so, while the
          # libraries copied in from Termux keep names like libz.so.1.
          for so in *.so *.so.*; do
            [ -e "$so" ] || continue
            dyn="$(readelf -d "$so")" || {
              echo "::error::readelf could not read $so"
              exit 1
            }
            # Without this the NEEDED entries below could all be present and still not
            # resolve, because the loader would never look in this directory for them.
            runpath="$(printf '%s' "$dyn" | sed -n 's/.*(RUNPATH).*\[\(.*\)\]/\1/p')"
            if [ "$runpath" != '$ORIGIN' ]; then
              echo "::error::$so has RUNPATH '${runpath:-none}', so the libraries staged beside it will not be found"
              rc=1
            fi
            for need in $(printf '%s' "$dyn" | sed -n 's/.*(NEEDED).*\[\(.*\)\]/\1/p'); do
              if [ -f "$need" ]; then
                continue
              fi
              if printf '%s' "$need" | grep -qE "$platform|$in_apk"; then
                continue
              fi
              echo "::error::$so needs $need, which is neither staged beside it, nor in the APK, nor an Android platform library"
              rc=1
            done
          done
          exit "$rc"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unity_dlp-android-arm64
          path: |
            unity_package/Plugins/Android/libs/arm64-v8a/
            unity_package/StreamingAssets/dlp/

  # ── iOS arm64 ────────────────────────────────────────────────────────────────
  ios:
    name: iOS arm64
    runs-on: macos-latest
    env:
      IPHONEOS_DEPLOYMENT_TARGET: '16.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false

      # Submodules are cloned shallow, which brings neither tags nor history.
      # The bundled yt-dlp-ejs version is read from its tag, and resolving a pin
      # made after a release needs to walk back to that tag, so restore both.
      - name: Fetch yt-dlp-ejs tags and history
        shell: bash
        run: |
          git -C vendor/yt-dlp-ejs fetch --tags --force --quiet
          # --unshallow errors on a complete clone, so ask first.
          if [ "$(git -C vendor/yt-dlp-ejs rev-parse --is-shallow-repository)" = "true" ]; then
            git -C vendor/yt-dlp-ejs fetch --unshallow --quiet
          fi

      - name: Install Rust targets
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim

      - name: Install Python ${{ env.PYTHON_VERSION }} (host — stdlib source for iOS)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache Python for iOS arm64 (python-apple-support)
        id: cache-py-ios
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: python-ios
          key: python-${{ env.PYTHON_VERSION }}-ios-support-${{ env.IOS_SUPPORT_BUILD }}

      - name: Download Python ${{ env.PYTHON_VERSION }} for iOS (BeeWare python-apple-support)
        if: steps.cache-py-ios.outputs.cache-hit != 'true'
        run: |
          TAG="${{ env.PYTHON_VERSION }}-${{ env.IOS_SUPPORT_BUILD }}"
          TARBALL="Python-${{ env.PYTHON_VERSION }}-iOS-support.${{ env.IOS_SUPPORT_BUILD }}.tar.gz"
          curl -fsSL -o "$TARBALL" \
            "https://github.com/beeware/python-apple-support/releases/download/${TAG}/${TARBALL}"
          mkdir python-ios
          tar -xzf "$TARBALL" -C python-ios

      # python-apple-support ships Python.xcframework; PyO3 wants a lib dir with
      # libpythonX.Y.a. Create shim directories for both device and simulator.
      - name: Set up Python lib dirs for iOS device and simulator
        run: |
          LIBPY="libpython${{ env.PYTHON_VERSION }}.a"
          DEVICE_FW="$(pwd)/python-ios/Python.xcframework/ios-arm64/Python.framework"
          SIM_FW_DIR="$(find "$(pwd)/python-ios/Python.xcframework" -mindepth 1 -maxdepth 1 \
            -type d -name '*simulator*' | head -1)"
          SIM_FW="${SIM_FW_DIR%/}/Python.framework"
          mkdir -p python-ios-device-lib python-ios-sim-lib
          cp "${DEVICE_FW}/Python" "python-ios-device-lib/${LIBPY}"
          cp "${SIM_FW}/Python"    "python-ios-sim-lib/${LIBPY}"
          # PYO3_CROSS_PYTHON_VERSION is set here rather than in the job env block:
          # job-level env cannot read the workflow-level env context.
          {
            echo "CFLAGS=-I${DEVICE_FW}/Headers"
            echo "IOS_DEVICE_LIB=$(pwd)/python-ios-device-lib"
            echo "IOS_SIM_LIB=$(pwd)/python-ios-sim-lib"
            echo "PYO3_CROSS_PYTHON_VERSION=${{ env.PYTHON_VERSION }}"
          } >> "$GITHUB_ENV"

      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ios-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ios-cargo-

      # No BINDGEN_EXTRA_CLANG_ARGS here, unlike the simulator step below. bindgen
      # derives its clang target from cargo's TARGET, and rust_to_clang_target maps
      # aarch64-apple-ios to arm64-apple-ios, which is what clang wants. SDKROOT
      # supplies the sysroot. The simulator needs the override because that mapping
      # yields arm64-apple-ios-sim, and clang only accepts -simulator.
      - name: Build iOS device (arm64)
        run: |
          SDKROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          export SDKROOT
          PYO3_NO_PYTHON=1 PYO3_CROSS_LIB_DIR="$IOS_DEVICE_LIB" \
            cargo build -p unity_dlp_core --profile release-with-debuginfo --target aarch64-apple-ios \
            --no-default-features --features js-quickjs

      - name: Build iOS simulator (arm64)
        run: |
          SDKROOT="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          export SDKROOT
          BINDGEN_EXTRA_CLANG_ARGS="--target=arm64-apple-ios-simulator --sysroot=$SDKROOT" \
          PYO3_NO_PYTHON=1 PYO3_CROSS_LIB_DIR="$IOS_SIM_LIB" \
            cargo build -p unity_dlp_core --profile release-with-debuginfo --target aarch64-apple-ios-sim \
            --no-default-features --features js-quickjs

      - name: Stage Python stdlib
        run: |
          # python-apple-support only ships the compiled static lib + headers;
          # the stdlib comes from the macOS host Python installed above.
          # Exclude lib-dynload (macOS .so binaries — not usable on iOS; C
          # extensions are compiled into libpythonX.Y.a by python-apple-support).
          python3 "unity_package/Python~/stage_stdlib.py" ios-arm64 \
            --exclude-dirs lib-dynload

      - name: Stage artifact
        run: |
          mkdir -p unity_package/Plugins/iOS
          rm -rf unity_package/Plugins/iOS/unity_dlp.xcframework
          xcodebuild -create-xcframework \
            -library target/aarch64-apple-ios/release-with-debuginfo/libunity_dlp.a \
            -library target/aarch64-apple-ios-sim/release-with-debuginfo/libunity_dlp.a \
            -output unity_package/Plugins/iOS/unity_dlp.xcframework

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unity_dlp-ios-arm64
          path: |
            unity_package/Plugins/iOS/unity_dlp.xcframework/
            unity_package/StreamingAssets/dlp/
