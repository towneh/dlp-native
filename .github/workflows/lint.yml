name: Lint

on:
  push:
    branches: [main, master, test-*]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python (ruff)
    runs-on: ubuntu-latest
    steps:
      # No submodules: vendor/ is upstream and excluded in ruff.toml.
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Ruff lint
        run: uvx ruff@0.16.2 check --output-format github .

      - name: Ruff format
        run: uvx ruff@0.16.2 format --check .
