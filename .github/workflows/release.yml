name: Release

# Attaches the Unity package tarball to a published release.
#
# Nothing is rebuilt here. The tarball is taken from the Build run that already
# ran for the release's commit, so what reaches the release is the artifact that
# passed verification rather than a fresh, unverified one. Keeping this separate
# from build.yml also keeps a publishing trigger away from that workflow's
# caches, which would otherwise be a cache-poisoning route into a release.
on:
  release:
    types: [published]
  # Re-attach by hand if the release was published before the build finished.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach the package to
        required: true

permissions:
  contents: read

jobs:
  attach:
    name: Attach the Unity package
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Attach the tarball
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail

          # Dereferences an annotated tag to the commit it points at, which is
          # what a workflow run records as its head SHA.
          commit="$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq '.sha')"
          echo "$TAG is $commit"

          run_id="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/runs?head_sha=$commit&status=success&per_page=1" \
            --jq '.workflow_runs[0].id // empty')"
          if [ -z "$run_id" ]; then
            echo "::error::no successful Build run for $TAG ($commit); re-run the build, then dispatch this workflow"
            exit 1
          fi
          echo "Taking the package from run $run_id"

          # This job has no checkout, so every gh subcommand that would otherwise
          # read the repository from a git remote has to be told it. The gh api
          # calls name it in the path already.
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" \
            --name unity-package-tarball --dir .

          # The per-platform zips go up too: run artifacts expire, so the release
          # is the only lasting source for them. gh unpacks an artifact on the way
          # down, so each is re-zipped, which is all GitHub's own archive is.
          #
          # Not with info-zip: it stores rather than compresses anything suffixed
          # .zip, and the staged stdlib is a deliberately uncompressed archive of
          # plain .py text, so that heuristic nearly doubles every asset. Python
          # deflates whatever it is given.
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=50" \
            --jq '.artifacts[] | select(.name | startswith("unity_dlp-")) | .name' \
            | while read -r name; do
                echo "Downloading $name"
                gh run download "$run_id" --repo "$GITHUB_REPOSITORY" \
                  --name "$name" --dir "$name"
                python3 -c \
                  "import shutil, sys; shutil.make_archive(sys.argv[1], 'zip', sys.argv[1])" \
                  "$name"
              done

          # Unglobbed, so a missing artifact is reported by the upload below rather
          # than by an unmatched wildcard here.
          ls -la
          gh release upload "$TAG" ./*.tgz ./*.zip --clobber --repo "$GITHUB_REPOSITORY"
