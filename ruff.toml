# Ruff covers the two Python files in this repo: the yt-dlp JS-challenge shim
# under python/ and the stdlib staging script under scripts/. Everything under
# vendor/ is upstream (yt-dlp, yt-dlp-ejs) and is not ours to lint.

target-version = "py312"
line-length = 100
extend-exclude = ["vendor"]

[lint]
select = ["ALL"]
ignore = [
    "COM812",  # conflicts with the formatter
    "ISC001",  # conflicts with the formatter
    "CPY001",  # no per-file copyright headers in this repo
    "D",       # docstring style; module/class docstrings are written where useful
]

[lint.per-file-ignores]
# The shim's signatures are fixed by yt-dlp's JsChallengeProvider API — the
# arguments have to be accepted whether or not this implementation reads them.
"python/unity_dlp_jsc/**" = ["ANN001", "ARG001", "BLE001", "EM102", "TRY003"]

# Build-script conventions: stdout is the output channel, and they run against a
# Python prefix the caller names, not untrusted input. Each is stored
# non-executable and invoked through an interpreter, so the shebang names that
# interpreter rather than declaring the file runnable; EXE001 only fires where the
# mode bit is visible, which a Windows checkout cannot reproduce.
"unity_package/Python~/*.py" = ["ANN", "EXE001", "PTH", "S603", "T201"]

# Both complexity rules trip on the same function, stage_stdlib's main(), which is
# a flat run of argument handling and path resolution rather than anything branchy
# enough to be worth splitting. Scoped to the one file so a script added beside it
# does not inherit the exemption silently.
"unity_package/Python~/stage_stdlib.py" = ["C901", "PLR0912"]

# Tests: asserts are the mechanism, annotations would be noise on fixtures, and
# tests/ is deliberately not a package so pytest's rootdir handling finds it.
"tests/**" = ["ANN", "INP001", "S101"]

[lint.isort]
# unity_dlp_js is this project's PyO3 module, injected into sys.modules by
# jsc_provider::register_module() — keep it out of the third-party block.
known-first-party = ["unity_dlp_js"]
