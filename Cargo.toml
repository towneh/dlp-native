[workspace]
members = [
    "crates/unity_dlp_core",
    "crates/unity_dlp_cli",
    "crates/unity_dlp_capi",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
# Kept in step with rust-toolchain.toml. Declared so an unsupported compiler
# fails at resolve time with a clear message rather than midway through a build.
rust-version = "1.94"

[workspace.dependencies]
pyo3 = { version = "0.22", features = ["abi3-py312"] }
rustyscript = { version = "0.12", default-features = false }
rquickjs = { version = "0.8", features = ["bindgen"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
once_cell = "1"

[workspace.lints.rust]
# pyo3 0.22's create_exception! macro expands a cfg(feature = "gil-refs") check
# against the *destination* crate, which does not declare that feature.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("gil-refs"))'] }

[workspace.lints.clippy]
# This crate is a raw C ABI over an embedded interpreter, so both of these are
# load-bearing rather than stylistic: an undocumented unsafe block is how the
# buffer overflow at the extract boundary went unnoticed, and an unchecked
# narrowing cast is what caused it.
undocumented_unsafe_blocks = "deny"
cast_possible_truncation = "deny"

[profile.release-with-debuginfo]
inherits = "release"
debug = true
split-debuginfo = "packed"
strip = "debuginfo"

[patch.crates-io]
# Upstream deno_ast 0.50.3 with its manifest version rewritten to 0.49.0, because
# rustyscript pins `deno_ast = "=0.49.0"` and an exact requirement will not
# resolve against 0.50.3. The rewrite is load-bearing: correcting it to the real
# version breaks resolution.
#
# The cost is that anything reading the lockfile sees 0.49.0 for this crate, so a
# `cargo audit` / `cargo deny` result for deno_ast has to be read against 0.50.3
# instead. VENDOR.md records both numbers; CI asserts they still hold.
deno_ast = { path = "crates/deno_ast_patch" }
